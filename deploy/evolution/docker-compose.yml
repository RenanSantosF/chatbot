# O servidor Evolution: WhatsApp por aparelho vinculado, sem a Meta.
#
# Sobe três coisas: a Evolution, um Postgres só dela e um Redis. Os dois
# últimos não são opcionais na versão 2 — sem Postgres ela não guarda a
# sessão (toda reinicialização pediria o QR code de novo), e sem Redis a
# reconexão fica lenta e instável.
#
# O banco é SEPARADO do banco do sistema de propósito: são ciclos de vida
# diferentes. A Evolution guarda credencial de sessão do WhatsApp e um
# histórico próprio que cresce rápido, e um `docker compose down -v` aqui
# não pode levar junto as conversas dos clientes.
#
# Subir:      docker compose up -d
# Ver o log:  docker compose logs -f evolution
# Atualizar:  docker compose pull && docker compose up -d

services:
  evolution:
    # Imagem do repositório mantido pelo projeto (evoapicloud). O antigo
    # `atendai/evolution-api` parou na v2.2.3, de fevereiro de 2025.
    #
    # A versão fica FIXA, e não em `latest`: a Evolution muda o formato dos
    # eventos entre versões maiores, e o sistema traduz esse formato. Subir
    # sozinha de madrugada é como as mensagens param de chegar sem ninguém
    # ter tocado em nada.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # --- Identidade e acesso ------------------------------------------
      # A chave que você vai colar na tela do Inteliwa. Troque por algo
      # aleatório de verdade:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      AUTHENTICATION_API_KEY: "TROQUE-ESTA-CHAVE"
      # O endereço público desta Evolution. Ela usa isto pra montar links
      # próprios; deixar errado não impede de conectar, mas atrapalha a
      # depuração porque os logs apontam pro lugar errado.
      SERVER_URL: "http://localhost:8080"

      # --- Banco --------------------------------------------------------
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      # O `connection_limit` não é ajuste fino: é o que impede a Evolution
      # de derrubar o banco sozinha.
      #
      # Ao conectar, o WhatsApp despeja o histórico do aparelho de uma vez
      # — centenas de conversas e contatos em segundos. O Prisma abre
      # conexão à vontade pra dar conta, e num pooler gratuito (15 clientes
      # no Supabase) isso estoura na hora, com
      # `EMAXCONNSESSION: max clients reached`. Aí não sobra conexão nem
      # pra ela nem pra mais ninguém no mesmo banco.
      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution@postgres:5432/evolution?connection_limit=8&pool_timeout=30"
      DATABASE_CONNECTION_CLIENT_NAME: "evolution"
      # O que ela guarda no banco dela. Mensagem e contato ficam ligados
      # porque a reconexão depende deles; o resto é peso morto pra nós — o
      # histórico que vale é o do Inteliwa, e duplicá-lo aqui só faz o
      # disco encher.
      # A sessão (as credenciais do aparelho vinculado) é guardada
      # independentemente destes campos — por isso desligar tudo aqui não
      # faz o QR code ser pedido de novo a cada reinício.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Mensagem NÃO é guardada aqui, e não é só economia de disco.
      #
      # Com o arquivamento ligado, a Evolution procura a mensagem original
      # no banco DELA antes de mandar o evento de status — e desiste do
      # evento quando não acha. Como o histórico de verdade é o do
      # Inteliwa, e o banco dela é só um espelho, esse espelho incompleto
      # vira tique de entrega que nunca chega.
      #
      # Desligado, ela manda o status sempre, sem consultar nada.
      # PRECISA ser true, e não é preferência: pra devolver o binário de
      # uma foto, a Evolution localiza a mensagem no banco DELA e pede ao
      # WhatsApp. Desligada, o anexo nunca volta — o painel mostra "não deu
      # pra buscar este anexo" e a foto vira um cartão de arquivo.
      #
      # O crescimento é contido do outro lado: a API baixa e guarda uma
      # cópia própria assim que a mídia chega, e daí em diante nunca mais
      # pergunta. O banco daqui só precisa segurar a mensagem por segundos.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      # Contato e conversa também ficam de fora: o sistema mantém os
      # próprios, e nunca lê os dela. Ligados, eles transformam a
      # sincronização inicial numa tempestade de escrita — quinhentas
      # conversas e quatrocentos contatos gravados de uma vez, pra
      # alimentar tabelas que ninguém consulta.
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      # O cache de "este número existe no WhatsApp".
      #
      # É a variável que mais dói esquecer: ela grava uma linha por
      # contato, e o código dispara TODOS em paralelo. Quatrocentos
      # contatos viram quatrocentas consultas simultâneas no instante da
      # conexão — nenhum limite de conexão sobrevive a isso num pooler
      # pequeno, e o banco inteiro para com EMAXCONNSESSION.
      #
      # O sistema não usa esse cache: quem sabe se o número existe é o
      # próprio envio, que falha com motivo legível quando não existe.
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"

      # --- Cache --------------------------------------------------------
      # Redis aqui porque o compose já sobe um. Onde subir um serviço a
      # mais custa (plano gratuito com limite de serviços), troque por
      # cache em memória: CACHE_REDIS_ENABLED=false e
      # CACHE_LOCAL_ENABLED=true. A Evolution cai no cache local sozinha.
      #
      # O que muda: o cache morre junto com o contêiner. Para um número
      # só, isso é uma reconexão mais lenta depois de reiniciar — não é
      # perda de sessão.
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379/6"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # --- Sessão -------------------------------------------------------
      # NÃO existe mais um `CONFIG_SESSION_PHONE_VERSION` aqui, e a
      # ausência é a configuração certa: a partir da 2.3 a Evolution busca
      # a versão do WhatsApp Web sozinha, direto de web.whatsapp.com, a
      # cada conexão. Fixar uma versão à mão era a causa número um de "o
      # QR code aparece, some e nunca conecta" — e hoje a variável
      # simplesmente não é lida.
      #
      # A consequência prática: este contêiner precisa de saída pra
      # internet além do WhatsApp em si. Bloqueado, ele cai numa versão
      # embutida que envelhece.
      #
      # O nome que a empresa vê em "Aparelhos conectados" no celular.
      CONFIG_SESSION_PHONE_CLIENT: "Inteliwa"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      # Quantas vezes o mesmo QR code é regerado antes de ela desistir.
      QRCODE_LIMIT: "10"
      # Não apagar a sessão sozinha ao desconectar: quem manda apagar é o
      # Inteliwa, na tela de desconectar. Apagar por conta própria faria a
      # empresa perder a sessão numa oscilação de rede.
      DEL_INSTANCE: "false"

      # ATENÇÃO: a imagem embute um `.env` com TODOS estes padrões ligados
      # (ela copia o próprio .env.example na construção). O que você define
      # aqui ganha; o que você NÃO define fica no padrão dela, que é
      # sempre "true". Por isso cada um está escrito por extenso acima,
      # inclusive os que parecem redundantes.

      # --- Log ----------------------------------------------------------
      # Sem WEBHOOKS na lista: o log de webhook despeja a mensagem inteira
      # do cliente no stdout, e isso é dado pessoal indo parar num arquivo
      # que ninguém trata como sigiloso.
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"

      # --- Integrações que NÃO usamos -----------------------------------
      # Desligadas por escolha: cada uma que fica de pé é uma porta a mais
      # e um processo a mais consumindo memória num servidor que só
      # precisa entregar mensagem.
      TYPEBOT_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      DIFY_ENABLED: "false"
      S3_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    # A Evolution quebra no start se o banco ainda não aceita conexão, e
    # o `restart` mascararia isso como um reinício em laço.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
